# macOS build: checks the whole workspace on an Apple Silicon Mac, then builds
# the app and its disk image and keeps the disk image as a downloadable
# artifact of the run. Beside that build, the Formula job builds this commit
# with the Homebrew formula and tests what it installed.
#
# Starts by hand (Actions tab, "Run workflow") or when a tag like v0.1.0 is
# pushed. Nothing here makes a release or uses a credential: the app is only
# signed ad hoc (no Apple certificate), so macOS asks to confirm it with
# "Open Anyway" the first time it is opened.
#
# Rules this file keeps (src-tauri/tests/workflow.rs checks them):
#   - every action is pinned to a full commit hash, with its release in a comment;
#   - the token can only read the repository;
#   - no pull request trigger, and no ${{ }} expression inside a run script;
#   - no step installs or runs NASM: mozjpeg assembles its Arm SIMD code with
#     clang on Apple Silicon, and only x86 builds need NASM (unlike Windows);
#   - the cache steps save only from main (see the comment at the first one);
#   - the Rust tests run even after a failed formatting or lint step;
#   - the app is checked (signature, worker sealed in) before it is uploaded;
#   - the Formula job needs the tests, has 60 minutes, uses no action but
#     the checkout (no cache, no toolchain), installs nothing else the
#     formula does not declare, and runs brew audit and
#     brew style on the committed formula, then git archive of HEAD,
#     brew install --build-from-source of a copy, and brew test, in that order.

name: macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A newer run for the same ref replaces the one still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # One shell for every step, the same as the Windows workflow. With
    # `shell: bash` set, every script runs with -e and -o pipefail.
    shell: bash

jobs:
  test:
    name: Test
    # Apple Silicon.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Saves its cache only from main: a tag run can restore the cache of the
      # default branch but not the cache of another tag, so a cache saved by a
      # tag run is never read and only costs upload time.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the hostile-input tests: a corrupt JPEG, a decompression
      # bomb, and a CSS crash that the worker process must survive.
      # --no-fail-fast: every test binary runs even after one fails, so one
      # run reports every macOS failure. Runs even when the formatting or the
      # lints failed, for the same reason.
      - name: Rust tests
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast

      # The glob is quoted so that node expands it, not the shell. Runs even
      # when the Rust tests failed, so one run reports the failures of both.
      - name: Window script tests
        if: success() || failure()
        run: node --test "tests/ui/*.test.js"

  build:
    name: Installer
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      # A cache of its own, unlike Windows: Mac minutes cost more than the
      # cache upload does. rust-cache keys it by job, so it stays apart from
      # the test job's debug-profile cache. It also keeps ~/.cargo/bin. Like
      # the test job's cache it is saved only from main (a tag run cannot
      # restore another tag's cache, only main's), so a tag run finds the Tauri
      # command line installed only when a run from main saved it; otherwise
      # the install below builds it from source.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The repository has no package.json, so the Tauri command line comes
      # from crates.io at a fixed version, built against the lock file of the
      # tool itself. When the cache already holds this version, cargo says so
      # and leaves it alone.
      - name: Install the Tauri command line
        run: cargo install tauri-cli --locked --version 2.12.4

      # Builds in release mode and bundles Lunaepix.app and the .dmg, both
      # signed ad hoc (tauri.macos.conf.json). The config file adds the worker
      # sidecar and builds it first (crates/xtask).
      - name: Build the app and the disk image
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json

      # Fails the job unless the worker sits in the app, the app's signature
      # holds (an ad-hoc one, made by the bundler, with sealed resources), and
      # the seal lists the worker; otherwise macOS can refuse the worker after
      # "Open Anyway". Checked in bundle/macos/ and again inside the mounted
      # .dmg, which is what people download. Each app's Contents/MacOS is
      # listed first, and a seal that lacks the worker prints the seal's
      # entries before the step fails, so one run shows what went wrong (the
      # listing and the printout are not checks).
      - name: Check the signature and the sealed worker
        run: |
          check_app() {
            ls -l "$1/Contents/MacOS"
            test -x "$1/Contents/MacOS/lunaepix-worker"
            codesign --verify --deep --strict --verbose=2 "$1"
            details=$(codesign -dv "$1" 2>&1)
            echo "$details"
            grep -qx 'Signature=adhoc' <<<"$details"
            grep -q '^Sealed Resources version=2' <<<"$details"
            if ! plutil -extract 'files2.MacOS/lunaepix-worker' xml1 -o - \
              "$1/Contents/_CodeSignature/CodeResources" >/dev/null; then
              echo "The seal of $1 does not list MacOS/lunaepix-worker. Its entries:"
              plutil -p "$1/Contents/_CodeSignature/CodeResources" || true
              return 1
            fi
          }
          check_app target/release/bundle/macos/Lunaepix.app
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          check_app "$mount/Lunaepix.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunaepix-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # Builds this commit with the Homebrew formula (Formula/lunaepix.rb), as
  # `brew install` does on a user's Mac, and runs the formula's test on what
  # it installed. The formula's url names the tag archive of the version: on
  # an rc tag that archive does not exist, and its checksum is only filled in
  # after the tag (docs/releasing.md). So the build goes through a copy of the
  # formula that points at an archive of this commit. Homebrew installs only
  # formulas that sit in a tap, so both live in a local tap of their own.
  #
  # No action but the checkout, so no cache, and no step installs a toolchain
  # or a package: a user's Mac has neither, so only what the formula declares
  # (Rust, from Homebrew) is there when it builds, and a dependency it forgot
  # fails here first.
  formula:
    name: Formula
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Homebrew does not update itself before a command: the run then uses
      # the Homebrew of the runner image, and starts sooner.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      # The two local taps: one holds the committed formula unchanged, the
      # other the copy that builds this commit.
      CHECK_TAP: lunaepix-ci/check
      BUILD_TAP: lunaepix-ci/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked unchanged, so the url and checksum lines people install from
      # are what Homebrew's audit and style checks read. The audit runs
      # offline (no --online), so the archive the url names need not exist
      # yet.
      - name: Check the committed formula
        run: |
          brew tap-new --no-git "$CHECK_TAP"
          tap=$(brew --repository "$CHECK_TAP")
          mkdir -p "$tap/Formula"
          cp Formula/lunaepix.rb "$tap/Formula/lunaepix.rb"
          brew audit --formula "$CHECK_TAP/lunaepix"
          brew style "$CHECK_TAP/lunaepix"

      # GitHub's tag archive is `git archive` of the tag: it holds only
      # tracked files. So the formula builds `git archive` of this commit, not
      # the working tree, and a build that needs an untracked file fails here.
      # The archive keeps the file name of the formula's url
      # (v<version>.tar.gz, read from the formula, not typed again), from
      # which Homebrew reads the version, and GitHub's top folder
      # (Lunaepix-<version>/). The copy of the formula differs only in its url
      # and sha256 lines: each is replaced as a whole line, and the step fails
      # unless each was replaced exactly once, so a reshaped formula cannot
      # quietly build the published archive instead. The diff is printed for
      # the log; it is not a check.
      - name: Build this commit with the formula
        run: |
          urls=$(grep -c '^  url "' Formula/lunaepix.rb || true)
          if [ "$urls" != 1 ]; then
            echo "Formula/lunaepix.rb has $urls url lines, not 1."
            exit 1
          fi
          url=$(sed -n 's/^  url "\(.*\)"$/\1/p' Formula/lunaepix.rb)
          name=${url##*/}
          case $name in
            v*.tar.gz) ;;
            *) echo "The formula's url does not end in v<version>.tar.gz: $url"; exit 1 ;;
          esac
          version=${name#v}
          version=${version%.tar.gz}
          archive="$RUNNER_TEMP/$name"
          git archive --format=tar.gz --prefix="Lunaepix-$version/" -o "$archive" HEAD
          sum=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          brew tap-new --no-git "$BUILD_TAP"
          tap=$(brew --repository "$BUILD_TAP")
          mkdir -p "$tap/Formula"
          copy="$tap/Formula/lunaepix.rb"
          sed -e "s|^  url \".*\"\$|  url \"file://$archive\"|" \
            -e "s|^  sha256 \".*\"\$|  sha256 \"$sum\"|" \
            Formula/lunaepix.rb > "$copy"
          diff Formula/lunaepix.rb "$copy" || true
          urls=$(grep -c "^  url \"file://$archive\"\$" "$copy" || true)
          sums=$(grep -c "^  sha256 \"$sum\"\$" "$copy" || true)
          if [ "$urls" != 1 ] || [ "$sums" != 1 ]; then
            echo "The copy has $urls url lines and $sums sha256 lines of this archive, not 1 each."
            exit 1
          fi
          brew install --build-from-source --verbose "$BUILD_TAP/lunaepix"

      # The formula's own test, on the installed copy in Homebrew's folder:
      # the command line compresses a PNG, the worker sits in the app, and
      # the app's seal holds, so nothing Homebrew does after the install
      # changed a file inside the app.
      - name: Test the installed formula
        run: brew test --verbose "$BUILD_TAP/lunaepix"
