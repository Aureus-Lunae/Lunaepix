# Windows build: checks the whole workspace on Windows, then builds the
# installer and keeps it as a downloadable artifact of the run.
#
# Starts by hand (Actions tab, "Run workflow") or when a tag like v0.1.0 is
# pushed. Nothing here signs the installer, makes a release or uses a
# credential: the installer is unsigned, so Windows SmartScreen warns on it.
#
# Rules this file keeps (src-tauri/tests/workflow.rs checks them):
#   - every action is pinned to a full commit hash, with its release in a comment;
#   - the token can only read the repository;
#   - no pull request trigger, and no ${{ }} expression inside a run script.
#   - every job that runs cargo installs NASM first (mozjpeg's SIMD code).

name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A newer run for the same ref replaces the one still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # One shell for every step, so the quoting below means the same thing
    # everywhere (PowerShell reads quotes and "--" differently).
    shell: bash

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Text fixtures and rustfmt must see the line endings the repository has.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # mozjpeg's SIMD code (lunaepix-core) is assembled with NASM when it
      # builds. Chocolatey does not put NASM on the path, so its folder is
      # added for the later steps.
      - name: Install NASM
        run: |
          choco install nasm --version=2.16.3 --no-progress -y
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the hostile-input tests: a corrupt JPEG, a decompression
      # bomb, and a CSS crash that the worker process must survive.
      # --no-fail-fast: every test binary runs even after one fails, so one
      # run reports every Windows failure.
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast

      # The glob is quoted so that node expands it, not the shell.
      - name: Window script tests
        run: node --test "tests/ui/*.test.js"

  build:
    name: Installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      # No build cache here: the test job's cache is a debug-profile cache,
      # which a release build cannot use, and a cache of its own would only
      # add upload time.

      # mozjpeg's SIMD code (lunaepix-core) is assembled with NASM when it
      # builds. Chocolatey does not put NASM on the path, so its folder is
      # added for the later steps.
      - name: Install NASM
        run: |
          choco install nasm --version=2.16.3 --no-progress -y
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"

      # The repository has no package.json, so the Tauri command line comes
      # from crates.io at a fixed version, built against the lock file of the
      # tool itself.
      - name: Install the Tauri command line
        run: cargo install tauri-cli --locked --version 2.12.4

      # Builds in release mode and bundles the NSIS and MSI installers. The
      # config file adds the worker sidecar and builds it first (crates/xtask).
      - name: Build the installer
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunaepix-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
