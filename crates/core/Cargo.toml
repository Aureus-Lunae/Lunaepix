[package]
name = "lunaepix-core"
description = "Lossless PNG, JPG and SVG optimisation: the Lunaepix core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The worker mode on its own. The bundle installs it beside the app as the
# worker sidecar (built and staged by crates/xtask, see
# src-tauri/tauri.bundle.conf.json), and the integration tests start it.
# The CLI, and the app when the sidecar is missing, answer the worker mode
# from their own binaries.
[[bin]]
name = "lunaepix-worker"
path = "src/bin/lunaepix-worker.rs"

[dependencies]
thiserror = { workspace = true }
# Same settings as the Step 2 evaluation: today's `oxipng -o 4 --strip safe`.
oxipng = { version = "=10.2.1", default-features = false, features = ["parallel"] }
tempfile = "3.27.0"
# Same settings as the Step 2 evaluation: a jpegtran-style coefficient
# transcode. The default features need nasm for SIMD, which only speeds up the
# DCT that a coefficient transcode never runs. `unwinding` lets libjpeg errors
# unwind as Rust panics (`extern "C-unwind"`); `jpegtran` builds transupp.c,
# which copies the markers.
mozjpeg-sys = { version = "=2.2.3", default-features = false, features = ["parallel", "unwinding", "jpegtran"] }
# Same settings as the Step 2 evaluation: `Jobs::default()` (svgo's
# preset-default) over a roxmltree parse, as the `oxvg optimise` CLI does.
# Pinned with `=`: the 0.0.x crates declare each other as `>=0.0`, so only
# the pins and the committed Cargo.lock keep them on matching versions.
oxvg_optimiser = "=0.0.9"
oxvg_ast = { version = "=0.0.9", features = ["roxmltree"] }
# The parser oxvg_ast reads (its `roxmltree` feature asks for 0.21). We parse
# with it ourselves, check the document, and hand that same document to oxvg.
# Pinned with `=`: the entity-expansion bound (svg::check_entities) relies on
# its limit of 255 nested references inside one reference, which the
# `roxmltree_*` tests in svg.rs check. Re-run them before any upgrade.
roxmltree = "=0.21.2"

# The worker's start-up calls (see src/platform.rs). Both versions are the ones
# already in Cargo.lock, so no new package.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug"] }

# The SDK's CREATE_NO_WINDOW, which a test compares with run.rs's own constant.
# Tests only, so the shipped worker gains no feature.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
# Test fixtures: `png` encodes (low compression, redundant chunk), `image`
# decodes for the pixel comparison and encodes the baseline JPEG fixtures
# (standard Huffman tables, so there is something to optimise). Its `webp`
# feature gives the lossless WebP fixtures, from a pure-Rust encoder.
png = "0.17.16"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Valid chunk CRCs for hand-made hostile PNGs (already in the tree via `png`).
crc32fast = "1.5.4"
# Renders the SVG input and output for the edge-noise comparison. No system
# fonts are loaded, so the fixtures carry no text.
resvg = { version = "=0.49.0", default-features = false }
