[package]
name = "lunaepix-core"
description = "Lossless and lossy PNG, JPG, SVG and WebP optimisation: the Lunaepix core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The worker mode on its own. The bundle installs it beside the app as the
# worker sidecar (built and staged by crates/xtask, see
# src-tauri/tauri.bundle.conf.json), and the integration tests start it.
# The CLI, and the app when the sidecar is missing, answer the worker mode
# from their own binaries.
[[bin]]
name = "lunaepix-worker"
path = "src/bin/lunaepix-worker.rs"

[dependencies]
thiserror = { workspace = true }
# Same settings as the Step 2 evaluation: today's `oxipng -o 4 --strip safe`.
# Pinned with `=`: the lossy PNG path also gates on oxipng's doc-hidden
# `internal_tests::PngData::from_slice` (png::lossy::check_with_oxipng).
# Re-check that call before any upgrade.
oxipng ={ version = "=10.2.1", default-features = false, features = ["parallel"] }
tempfile = "3.27.0"
# A jpegtran-style coefficient transcode (the lossless path, as in the Step 2
# evaluation) and a pixel re-encode (the lossy path). `nasm_simd` builds
# mozjpeg's SIMD code (DCT, colour conversion, sampling), which speeds up the
# lossy decode and encode; it needs `nasm` on the PATH at build time
# (.github/workflows/windows.yml installs it). The lossless transcode runs no
# DCT, so its output is the same with or without it. `unwinding` lets libjpeg
# errors unwind as Rust panics (`extern "C-unwind"`); `jpegtran` builds
# transupp.c, which copies the markers.
mozjpeg-sys = { version = "=2.2.3", default-features = false, features = ["parallel", "unwinding", "jpegtran", "nasm_simd"] }
# Same settings as the Step 2 evaluation: `Jobs::default()` (svgo's
# preset-default) over a roxmltree parse, as the `oxvg optimise` CLI does.
# Pinned with `=`: the 0.0.x crates declare each other as `>=0.0`, so only
# the pins and the committed Cargo.lock keep them on matching versions.
oxvg_optimiser = "=0.0.9"
oxvg_ast = { version = "=0.0.9", features = ["roxmltree"] }
# The parser oxvg_ast reads (its `roxmltree` feature asks for 0.21). We parse
# with it ourselves, check the document, and hand that same document to oxvg.
# Pinned with `=`: the entity-expansion bound (svg::check_entities) relies on
# its limit of 255 nested references inside one reference, which the
# `roxmltree_*` tests in svg.rs check. Re-run them before any upgrade.
roxmltree = "=0.21.2"
# The lossy PNG path: `png` decodes the source to RGBA (palette, tRNS and
# greyscale expanded, 16-bit reduced) and writes the indexed result; quantizr
# reduces the colours to a palette with alpha, with dithering. Both pure Rust.
# The tests also use `png` to encode their fixtures.
png = "0.17.16"
quantizr = "=1.4.3"
# The lossy WebP path (src/webp/codec.rs, the only libwebp FFI): libwebp
# decodes the source to RGBA and encodes it again with its simple lossy
# encoder. Failures come back as return codes, so nothing unwinds through C.
# The tests also use it for their lossy WebP fixtures (the `image` crate only
# encodes lossless WebP). Not the `webp` wrapper crate, which links a second
# copy of libwebp's C symbols.
libwebp-sys = "=0.14.4"

# The worker's start-up calls (see src/platform.rs). Both versions are the ones
# already in Cargo.lock, so no new package.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug"] }

# The SDK's CREATE_NO_WINDOW, which a test compares with run.rs's own constant.
# Tests only, so the shipped worker gains no feature.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
# Chunk CRCs: the tests make valid ones for hand-made hostile PNGs. Already in
# the tree via `png`.
crc32fast = "1.5.4"
# Test fixtures: `image` decodes for the pixel comparison and encodes the
# baseline JPEG fixtures (standard Huffman tables, so there is something to
# optimise). Its `webp` feature gives the lossless WebP fixtures, from a
# pure-Rust encoder. (`png`, which encodes the PNG fixtures, is a normal
# dependency now.)
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Renders the SVG input and output for the edge-noise comparison. No system
# fonts are loaded, so the fixtures carry no text.
resvg = { version = "=0.49.0", default-features = false }
