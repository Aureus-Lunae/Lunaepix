# Settings for cargo-about, which writes THIRD-PARTY-LICENSES.html (the
# licences of the code that ships inside Lunaepix). Regenerate it with:
#
#   cargo about generate -c about.toml about.hbs -o THIRD-PARTY-LICENSES.html
#
# `accepted` is a policy, not a convenience: only permissive licences, plus
# MPL-2.0 (oxvg pulls in MPL-2.0 crates; a user decision). A GPL, LGPL or AGPL
# crate, or any licence not listed here, makes the run fail. Do not add to
# this list to make a run pass: report it to the project owner instead
# (src-tauri/tests/config.rs checks the list).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "IJG",
    "MPL-2.0",
]

# Only what is compiled into the app. Test-only crates are not shipped, and
# build scripts (and the crates only they use) run at build time: none of
# their code ends up in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The platforms the app is built for (Linux and Windows; no macOS, no
# mobile), so crates that only other platforms use are not listed.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# libdeflate-sys declares only Apache-2.0, but it vendors libdeflate's C code,
# which is MIT ("Copyright 2016 Eric Biggers", "2024 Google LLC", in
# libdeflate/COPYING inside the crate). Its notice must ship, so the crate is
# clarified from the two real files. The checksums are SHA-256; a new version
# of the crate with changed files fails the run, which is the point.
[libdeflate-sys.clarify]
license = "Apache-2.0 AND MIT"

[[libdeflate-sys.clarify.files]]
path = "LICENSE"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"
license = "Apache-2.0"

[[libdeflate-sys.clarify.files]]
path = "libdeflate/COPYING"
checksum = "4ad69099cb4374836fd27583d9991e2838cd86b6e4666ab26b2d32582c91e73a"
license = "MIT"

# libwebp-sys declares only MIT, but vendors libwebp's C code, which is
# BSD-3-Clause (vendor/COPYING in the crate), with Google's patent grant
# (vendor/PATENTS, which about.hbs prints). The crate ships no MIT file of its
# own, so the MIT part uses cargo-about's standard text.
[libwebp-sys.clarify]
license = "MIT AND BSD-3-Clause"

[[libwebp-sys.clarify.files]]
path = "vendor/COPYING"
checksum = "5aec868f669e384a22372a4e8a1a6cd7d44c64cd451f960ca69cc170d1e13acf"
license = "BSD-3-Clause"

# quantizr declares no licence in its manifest (only `license-file`), so
# cargo-about cannot read it: the crate is clarified from that file, which is
# MIT ("Copyright (c) 2017 Sergey Alexandrovich").
[quantizr.clarify]
license = "MIT"

[[quantizr.clarify.files]]
path = "LICENSE"
checksum = "407b2d167f73ef78da1fcbfb6c2f1051f195b1984b9bfeeac0a39b34c198a7fe"
license = "MIT"
